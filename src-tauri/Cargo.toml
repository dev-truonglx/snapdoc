[package]
name = "snapdoc"
version = "0.2.6"
description = "SnapDoc — fast screenshot + annotation app"
authors = ["SnapDoc"]
edition = "2021"

[lib]
name = "snapdoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["time"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native screen capture (monitors + windows), cross-platform.
# - macOS: chỉ dùng xcap để LIỆT KÊ màn hình/cửa sổ (metadata). Việc grab pixel
#   chuyển sang ScreenCaptureKit (xem capture/mac_sck.rs).
# - Windows: KHÔNG bật feature "wgc" cho window capture vì WGC lock một static
#   Mutex trong suốt quá trình capture (3s timeout) → deadlock khi có nhiều thread.
#   Dùng GDI PrintWindow (default) — ổn định, không treo, hỗ trợ mọi Windows 7+.
#   Monitor/region capture vẫn dùng WGC riêng qua xcap monitor API (không lock window mutex).
xcap = { version = "0.9" }
# Image encode/decode + crop
image = "0.25"
# Robust cross-platform image clipboard (arboard handles RGBA -> native formats)
arboard = "3"

base64 = "0.22"

# History/Library: metadata SQLite (bundled — không cần sqlite3 hệ thống trên
# Windows/macOS) + UUID cho id bản ghi.
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

# macOS: đọc trạng thái nút chuột / phím toàn cục để xử lý input cho overlay
# mà không cần focus cửa sổ.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3", features = ["CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow", "CGEvent"] }
# AppKit để cấu hình NSWindow của overlay: level cao + collectionBehavior, như
# UI Cmd+Shift+5 của macOS (phủ menu bar, xuất hiện trên mọi Space, hiện cùng
# lúc trên TẤT CẢ màn hình).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWindow",
    "NSResponder",
    "NSApplication",
    "NSScreen",
    "NSGraphics",
] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCScreenshotManager", "SCShareableContent", "SCStream", "SCError", "block2", "dispatch2", "objc2-core-graphics", "objc2-core-media", "objc2-core-foundation"] }
block2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
# Quay video liên tục (capture/mac_stream.rs): SCStream trả frame qua
# CMSampleBuffer (objc2-core-media) bọc CVPixelBuffer (objc2-core-video) —
# cần 2 crate này làm dependency trực tiếp để gọi hàm đọc pixel + tạo CMTime
# cho minimumFrameInterval (fps).
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
# Dispatch queue riêng cho SCStream callback (không dùng main queue để callback
# nhận frame liên tục 30fps không bị chặn bởi UI thread).
dispatch2 = "0.3.1"

# Windows: đọc trạng thái nút chuột / phím toàn cục cho overlay (GetAsyncKeyState)
# mà không cần focus cửa sổ — tương đương vai trò CoreGraphics trên macOS.
# Win32_System_Com: CoInitializeEx / CoUninitialize để init COM STA trước khi
# gọi WGC capture_image() trên thread nền, ngăn crash RPC_E_WRONG_THREAD.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
] }

# Tối ưu DEPENDENCIES ngay cả trong bản debug (dev:mac). Code của ta vẫn build
# nhanh + debug được, nhưng image/miniz_oxide/xcap/base64 chạy ở opt-level 3 nên
# mã hoá PNG ảnh full-screen Retina không còn chậm hàng giây như debug thuần.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# panic = "abort" đã bỏ: với "abort", catch_unwind không bắt được panic từ xcap/WGC
# → process bị kill thay vì báo lỗi. Dùng default "unwind" để có thể recover.
strip = true
