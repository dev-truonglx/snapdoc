[package]
name = "snapdoc"
version = "1.3.9"
description = "SnapDoc — fast screenshot + annotation app"
authors = ["SnapDoc"]
edition = "2021"

[lib]
name = "snapdoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["time"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native screen capture (monitors + windows), cross-platform.
# - macOS: chỉ dùng xcap để LIỆT KÊ màn hình/cửa sổ (metadata). Việc grab pixel
#   chuyển sang ScreenCaptureKit (xem capture/mac_sck.rs).
# - Windows: KHÔNG bật feature "wgc" cho window capture vì WGC lock một static
#   Mutex trong suốt quá trình capture (3s timeout) → deadlock khi có nhiều thread.
#   Dùng GDI PrintWindow (default) — ổn định, không treo, hỗ trợ mọi Windows 7+.
#   Monitor/region capture vẫn dùng WGC riêng qua xcap monitor API (không lock window mutex).
xcap = { version = "0.9" }
# Image encode/decode + crop
image = "0.25"
# Robust cross-platform image clipboard (arboard handles RGBA -> native formats)
arboard = "3"

base64 = "0.22"

# Container `.snapdoc` (ảnh nền + lớp annotation trong 1 file) — xem
# `snapdoc_file.rs`. Đã có sẵn trong Cargo.lock (dependency gián tiếp của
# tauri-plugin-updater) nên khai trực tiếp gần như không thêm thời gian build.
# `default-features = false` + `deflate`: bỏ bzip2/zstd/lzma không dùng tới
# (mọi entry ghi ở level 0 Stored, `deflate` chỉ để đọc được file zip lạ).
zip = { version = "4", default-features = false, features = ["deflate"] }

# Ghi âm microphone khi quay màn hình (record/audio_mic.rs) — trước đây chỉ
# khai dưới khối macOS nên KHÔNG build trên Windows; chuyển lên đây (dùng
# chung cho mọi nền tảng) để record/audio_wasapi.rs (Windows, audio hệ thống —
# xem plan Phase 5) cũng dùng được cùng crate.
cpal = "0.18"

# History/Library: metadata SQLite (bundled — không cần sqlite3 hệ thống trên
# Windows/macOS) + UUID cho id bản ghi.
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

# macOS: đọc trạng thái nút chuột / phím toàn cục để xử lý input cho overlay
# mà không cần focus cửa sổ.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3", features = ["CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow", "CGEvent"] }
# AppKit để cấu hình NSWindow của overlay: level cao + collectionBehavior, như
# UI Cmd+Shift+5 của macOS (phủ menu bar, xuất hiện trên mọi Space, hiện cùng
# lúc trên TẤT CẢ màn hình).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWindow",
    "NSResponder",
    "NSApplication",
    "NSScreen",
    "NSGraphics",
] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCScreenshotManager", "SCShareableContent", "SCStream", "SCError", "block2", "dispatch2", "objc2-core-graphics", "objc2-core-media", "objc2-core-foundation", "libc"] }
block2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
# Quay video liên tục (capture/mac_stream.rs): SCStream trả frame qua
# CMSampleBuffer (objc2-core-media) bọc CVPixelBuffer (objc2-core-video) —
# cần 2 crate này làm dependency trực tiếp để gọi hàm đọc pixel + tạo CMTime
# cho minimumFrameInterval (fps).
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
# Đọc AudioBufferList/AudioStreamBasicDescription trả về từ SCStream khi bật
# capturesAudio (quay âm thanh hệ thống) — xem capture/mac_stream.rs.
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
# Dispatch queue riêng cho SCStream callback (không dùng main queue để callback
# nhận frame liên tục 30fps không bị chặn bởi UI thread).
dispatch2 = "0.3.1"
# Accessibility API (AXUIElement) — raise ĐÚNG 1 cửa sổ cụ thể lên trước khi
# bắt đầu quay (xem `windows::ax_raise_window`). `NSRunningApplication.activate`
# (objc2-app-kit, đã có sẵn) chỉ đưa được cả APP lên trước, không chọn được
# đúng cửa sổ nếu app có nhiều cửa sổ (vd Finder). Dùng crate -sys thuần (khớp
# style raw FFI đã có ở mac_sck.rs) thay vì crate `accessibility` cấp cao vì
# crate đó kéo theo `objc`/`cocoa` (runtime Objective-C CŨ) song song objc2
# đang dùng xuyên suốt — không cần thiết cho vài lệnh AX đơn giản này.
accessibility-sys = "0.2.0"
# CFDictionary/CFArray/CFString THÔ (không qua objc2-core-foundation) để khớp
# type hệt những gì `accessibility-sys` khai (cùng crate `core-foundation-sys`,
# tránh phải ép kiểu con trỏ qua lại giữa 2 hệ bọc CoreFoundation khác nhau).
core-foundation-sys = "0.8.7"
# Ghi âm microphone (Phase 4 — quay màn hình có âm thanh): SCStream chỉ hỗ trợ
# captureMicrophone từ macOS 15, còn app hỗ trợ tối thiểu macOS 14 (xem
# tauri.conf.json bundle.macOS.minimumSystemVersion), nên dùng cpal (CoreAudio
# HAL trực tiếp) độc lập với ScreenCaptureKit thay vì phụ thuộc API mới.
# (cpal giờ khai ở khối [dependencies] chung phía trên, dùng chung cho Windows.)

# Windows: đọc trạng thái nút chuột / phím toàn cục cho overlay (GetAsyncKeyState)
# mà không cần focus cửa sổ — tương đương vai trò CoreGraphics trên macOS.
# Win32_System_Com: CoInitializeEx / CoUninitialize để init COM STA trước khi
# gọi WGC capture_image() trên thread nền, ngăn crash RPC_E_WRONG_THREAD.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    # DwmGetWindowAttribute(DWMWA_EXTENDED_FRAME_BOUNDS) — đọc kích thước THẬT
    # của 1 cửa sổ (không tính viền bóng đổ vô hình mà GetWindowRect trả về),
    # dùng trong capture/windows_stream.rs để khởi tạo encoder đúng kích thước
    # trước khi frame đầu tiên từ WGC tới.
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # GetWindowRect/SetWindowPos — resize capture-bar bằng 1 lệnh Win32 atomic
    # duy nhất (set cả size+position cùng lúc), tương đương NSWindow.setFrame
    # bên macOS, tránh nháy do set_size/set_position riêng lẻ của Tauri là 2
    # lệnh tách rời (xem `windows::resize_capture_bar`).
    "Win32_UI_WindowsAndMessaging",
] }
# Quay video liên tục qua Windows.Graphics.Capture (capture/windows_stream.rs)
# — crate cấp cao ẩn phần COM/WinRT, tương đương vai trò
# objc2-screen-capture-kit bên macOS. Phiên bản "1" viết theo API đã biết lúc
# lên plan (xem .claude/plans) — CHƯA build/test được trên Windows thật trong
# môi trường phát triển này, kiểm tra lại theo lỗi biên dịch `cargo check` nếu
# API lệch so với bản cài đặt thực tế.
windows-capture = "1"

# Tối ưu DEPENDENCIES ngay cả trong bản debug (dev:mac). Code của ta vẫn build
# nhanh + debug được, nhưng image/miniz_oxide/xcap/base64 chạy ở opt-level 3 nên
# mã hoá PNG ảnh full-screen Retina không còn chậm hàng giây như debug thuần.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# panic = "abort" đã bỏ: với "abort", catch_unwind không bắt được panic từ xcap/WGC
# → process bị kill thay vì báo lỗi. Dùng default "unwind" để có thể recover.
strip = true
